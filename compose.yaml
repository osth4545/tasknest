services:
  web:
    build: .
    restart: unless-stopped
    ports:
      - "${PORT:-80}:8000"
    environment:
      SECRET_KEY: ${SECRET_KEY:?Run python setup_env.py first}
      DATABASE_URL: postgresql://tasknest:${POSTGRES_PASSWORD:?Run python setup_env.py first}@db:5432/tasknest
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 30s
      timeout: 5s
      retries: 3
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: tasknest
      POSTGRES_USER: tasknest
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Run python setup_env.py first}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tasknest -d tasknest"]
      interval: 5s
      timeout: 5s
      retries: 12
volumes:
  postgres_data:
